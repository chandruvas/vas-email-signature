<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAS Solicitors Christmas Email Signature</title><style>body{font:14px Arial,sans-serif;background:#f1f3f5;margin:0;padding:24px;color:#243746}.wrap{max-width:900px;margin:auto}.panel{background:white;padding:20px;border-radius:10px;box-shadow:0 2px 12px #0001}.hint{color:#596875;font-size:13px;line-height:1.5}iframe{width:100%;height:1050px;border:1px solid #ddd;background:white}button{background:#075b87;color:white;border:0;border-radius:5px;padding:10px 16px;font-weight:bold;cursor:pointer;margin:8px 8px 12px 0}</style></head><body><div class="wrap"><div class="panel"><h2>VAS Solicitors — Christmas Signature 2026</h2><p class="hint">Preview the email-safe signature below. Use the supplied accreditation image files in the assets folder to replace the four accreditation placeholders. Social links are already connected to the official profile URLs supplied.</p><button id="copy">Copy signature HTML</button><button id="open">Open signature file</button><div id="status" class="hint" aria-live="polite"></div><iframe id="frame" title="Signature preview" src="signature.html"></iframe></div></div><script>document.getElementById('copy').addEventListener('click',async()=>{try{const r=await fetch('signature.html');const h=await r.text();await navigator.clipboard.writeText(h);document.getElementById('status').textContent='HTML source copied. For Outlook, use an HTML-signature installation method; pasting source text directly will not render it.'}catch(e){document.getElementById('status').textContent='Clipboard access unavailable. Open signature.html and copy its source manually.'}});document.getElementById('open').addEventListener('click',()=>window.open('signature.html','_blank'));</script></body></html>
